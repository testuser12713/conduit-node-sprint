name: conduit-api

services:
  db:
    image: docker.io/library/postgres:18.6-trixie
    environment:
      POSTGRES_USER: conduit
      POSTGRES_DB: conduit
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conduit -d conduit"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: docker.io/library/node:22-bookworm-slim
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:-postgresql://conduit@db:5432/conduit?schema=public}
      JWT_SECRET: ${JWT_SECRET:-}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node-modules:/app/node_modules
    command:
      - sh
      - -c
      - |
        set -e
        if [ -z "$$JWT_SECRET" ]; then
          export JWT_SECRET="$$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"
        fi
        npm ci --no-audit --no-fund
        npx prisma generate
        npm run build
        npm run start:prod

volumes:
  db-data:
  node-modules:
