services:
  db:
    image: docker.io/library/postgres:18.6-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: conduit
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d conduit"]
      interval: 5s
      timeout: 5s
      retries: 12
