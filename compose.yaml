services:
  db:
    image: docker.io/library/postgres:18.6-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-conduit}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: ${DB_NAME:-conduit}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - conduit-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USER:-conduit} -d ${DB_NAME:-conduit}',
        ]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  conduit-db-data:
